<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Tailwind v4 parser corpus utilities</title>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-fuchsia-500/30">
<header class="sticky top-0 z-50 flex items-center justify-between border-b border-white/10 bg-slate-900/80 p-4 backdrop-blur-md">
  <a class="text-xl font-bold tracking-tight hover:text-sky-300 focus-visible:outline-2 focus-visible:outline-offset-4" href="#content">Corpus</a>
  <button class="rounded-lg bg-sky-500/75 px-4 py-2 shadow-lg ring-2 ring-sky-300 transition duration-300 ease-in-out hover:scale-105 active:translate-y-1 disabled:opacity-50">Explore</button>
</header>
<main id="content" class="@container mx-auto grid min-h-screen max-w-7xl grid-cols-1 gap-6 p-6 md:grid-cols-3 lg:gap-8">
  <article class="group relative col-span-2 overflow-hidden rounded-2xl bg-linear-to-br from-indigo-600 via-purple-500/80 to-pink-400 p-8 shadow-xl hover:shadow-2xl">
    <h1 class="text-4xl leading-tight font-semibold text-balance group-hover:underline">Modern CSS</h1>
    <p class="mt-4 max-w-prose text-lg/7 text-white/90 first-letter:text-3xl before:content-['→']">Layers, properties, colors and nested variants.</p>
    <div class="mt-8 flex flex-wrap gap-3 *:rounded-full *:border *:p-2">
      <span class="rotate-12 skew-x-3 translate-x-1/2 scale-95">Transforms</span>
      <span class="animate-pulse blur-[0.5px] brightness-110 contrast-125 saturate-150">Filters</span>
      <span class="animate-spin border-dashed">Animation</span>
    </div>
  </article>
  <aside class="@md:flex @md:gap-4 space-y-4 divide-y divide-slate-700">
    <form class="flex flex-col gap-4 accent-emerald-500">
      <input aria-label="Search" class="w-full appearance-none rounded-md border border-slate-600 bg-transparent p-3 placeholder:text-slate-400 focus:border-sky-400 focus:ring-4 focus:ring-sky-500/25" placeholder="Search">
      <input aria-label="Range" type="range" class="accent-pink-500">
      <label class="has-checked:bg-emerald-900"><input type="checkbox" class="peer sr-only"><span class="peer-checked:text-emerald-300">Checked</span></label>
    </form>
    <ul class="list-disc pl-6 marker:text-sky-400"><li class="nth-2:bg-slate-800">Variants</li><li class="odd:italic even:font-bold">Selectors</li></ul>
  </aside>
  <section class="col-span-full grid grid-cols-[repeat(auto-fit,minmax(12rem,1fr))] gap-[clamp(1rem,2vw,3rem)] supports-[display:grid]:grid motion-safe:animate-bounce motion-reduce:transition-none dark:bg-black">
    <div class="aspect-video overflow-auto overscroll-contain scroll-smooth bg-[oklch(0.7_0.2_240)] object-cover mix-blend-multiply [mask-image:linear-gradient(black,transparent)]">Arbitrary values</div>
    <div class="border-2 border-dotted outline-2 outline-offset-2 outline-amber-400 ring-4 ring-inset ring-fuchsia-400/50 inset-shadow-sm text-shadow-lg">Shadows</div>
    <div class="h-[calc(100dvh-4rem)] w-1/3 min-w-0 flex-1 grow shrink-0 basis-1/2 self-end justify-self-center whitespace-nowrap truncate">Sizing</div>
  </section>
</main>
</body>
</html>
